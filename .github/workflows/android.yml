name: Android APK and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Web and DSP checks
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run test:dsp
          npm run build
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run dev > /tmp/rig-server.log 2>&1 &
          RIG_SERVER_PID=$!
          trap 'kill "$RIG_SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break || sleep 1
          done
          npm run test:ui
          npm run test:bridge
          npm run test:standalone
      - name: Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build APK and lint
        run: ./android/gradlew -p android --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rig-guitar-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/rig-studio.html
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
